unsourced:
  - id: corpus.filings
    desc: 84-filing corpus
    anchor: '\*\*([\d.,]+)-filing'
    reason: infra/ingest stat — count of ingested filings, not in any committed eval JSON
  - id: corpus.companies
    desc: ~10,400 EDGAR companies
    anchor: '\*\*~([\d.,]+) companies'
    reason: infra stat — size of EDGAR ticker->CIK map, not an eval output
  - id: corpus.size_mb
    desc: 274 MB v2 corpus
    anchor: '\*\*([\d.,]+) MB v2 corpus'
    reason: infra/DB stat — Neon storage footprint, not in any committed eval JSON
  - id: demo.cold_start
    desc: ~13 s web cold start
    anchor: '~([\d.,]+) s Cloud Run scale-to-zero'
    reason: observed once — Cloud Run scale-to-zero wake of the web host, not benchmarked
  - id: tests.count
    desc: 118 tests
    anchor: 'runs all \*\*([\d.,]+) tests\*\*'
    reason: verified by running pytest (no secrets), not a committed JSON artifact
  - id: tests.functions
    desc: test-function count
    anchor: 'tests\*\* \(([\d.,]+) functions\)'
    reason: verified by pytest collection, not a committed JSON artifact
  - id: audit.agreement
    desc: judge audit 19/20
    anchor: 'judge on 20 verdicts and agreed \*\*([\d.,]+)/20\*\*'
    reason: adjudication recorded in docs/faithfulness-spotcheck.md, not a JSON field
  - id: target.recall
    desc: V2 recall@5 target
    anchor: '\*\*([\d.,]+)\*\* \| 0\.75'
    reason: design-doc target (the 0.75 goal), not a measured value
  - id: target.faithfulness
    desc: faithfulness target
    anchor: '\*\*0\.93\*\* \| ([\d.,]+) ✅'
    reason: design-doc target (0.80 floor), not a measured value
  - id: ci.cost_per_run
    desc: CI cost per run
    anchor: '~\$([\d.,]+)/run'
    reason: estimate (~30 query embeddings at CI depth), not a committed measurement
  - id: ci.resolution
    desc: CI per-question recall resolution
    anchor: 'is ±([\d.,]+) recall@5'
    reason: arithmetic (1/30 on the 30-q subset), not an artifact value

# Verified values that legitimately recur (secondary mentions, restatements,
# fixed thresholds, design-doc targets). Coverage treats a number as fine if it
# equals one of these within tol. Primary occurrences are strictly checked above.
allow:
  - {value: 0.64, tol: 0.001, why: recall@5 V2 recurs (highlight/bracket/footnote/target)}
  - {value: 0.093, tol: 0.001, why: strict recall recurs (bracket + footnote)}
  - {value: 0.0933, tol: 0.001, why: strict recall (footnote/grid contrast)}
  - {value: 0.207, tol: 0.001, why: gain recurs (summary heading + body)}
  - {value: 0.75, tol: 0.001, why: design-doc recall target}
  - {value: 0.80, tol: 0.001, why: design-doc faithfulness target}
  - {value: 0.005, tol: 0.0005, why: design-doc cost target (<$0.005)}
  - {value: 0.5, tol: 0.001, why: fuzzy(0.5) matcher threshold (structural)}
  - {value: 50, tol: 0.5, why: "'>=50% of gold tokens' matcher rule (structural)"}
  - {value: 74, tol: 0.5, why: restatement of 0.74 attempted-accuracy as ~74%}
  - {value: 0.017, tol: 0.0005, why: V2 cost recurs (table + provenance footnote)}
  - {value: 0.0045, tol: 0.0003, why: live-API cost recurs (highlight + footnote)}
  - {value: 0.93, tol: 0.001, why: faithfulness V2 recurs (table/highlight/footnote/audit)}
  - {value: 0.929, tol: 0.001, why: committed faithfulness recurs (footnote + audit detail)}
  - {value: 0.10, tol: 0.001, why: CI max_drop recurs (restated as '0.10 ~= 3 questions')}
  - {value: 95, tol: 0.5, why: 95% confidence-interval level (structural)}

# Lines whose numbers are not eval claims (skipped by the coverage scan).
ignore:
  - 'shields\.io|img src=|https?://|badge'          # badge / image / URL lines
  - 'Python 3\.11'                                   # runtime version
  - '1,200 million'                                  # numeric-normalizer example ($1.2B)
  - 'assets/hero\.png'                               # image ref with ?v=
  - 'grew 5%'                                         # fuzzy-blindness example ("grew 5%" vs "25%")
  - 'CC-BY-NC'                                        # license name (…-4.0), not a metric
