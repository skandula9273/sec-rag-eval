# Claims manifest — maps every quantitative README claim to its source of truth.
#
# Consumed by `src/sec_rag/eval/check_numbers.py` (`make check-numbers`). Each
# `claims` entry: an `anchor` regex (ONE capture group = the number, matched in
# README.md exactly once), the `artifact` file + `path` (list of keys) whose value
# it must equal within `tol`. Derived numbers use `values:` + `expr:` instead.
# `unsourced` = numbers with no committed artifact (recorded, listed, never failed).
# `allow` = verified values that legitimately recur (secondary/footnote mentions).
# `ignore` = lines whose numbers are not eval claims.
#
# Deliberate older-run citations are expressible: the `artifact` field names the
# exact run, so "cites the 2026-06-29 run on purpose" is a line here, not staleness.

readme: README.md
artifacts_dir: eval_results

