name: eval-ci

# Retrieval-only smoke eval on every PR. Gate params (subset, baseline, matcher,
# threshold) live in configs/ci_eval.yaml, NOT here — this file only orchestrates.
# Deliberately NOT the full n=150 benchmark: that's minutes + real cost per PR and
# needs Anthropic generation. This is a 30-question retrieval-only smoke test; the
# full benchmark is run manually / on release. See README "eval-as-CI".

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # to post the delta comment (downgraded to read-only on fork PRs)

concurrency:
  group: eval-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung DB/network can't burn the runner budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run smoke eval (retrieval-only, 30 q)
        id: eval
        env:
          # Only OpenAI (query embeddings) + Neon are needed — no Anthropic, since the
          # gate is retrieval-only. Absent on fork PRs -> ci_eval skips gracefully.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sec_rag.eval.ci_eval

      - name: Post delta comment
        # Runs even if the gate failed (to show the delta); skipped when the eval was
        # skipped (no keys) or on fork PRs (no write token).
        if: >
          always() &&
          steps.eval.outputs.status != 'skip' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ci_eval_comment.md', 'utf8');
            const marker = '<!-- ci-eval-smoke -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
